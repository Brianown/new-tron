# QKGuard (watchdog)
# ---------------------------------------------------------------------------
# Probe /api/health every interval_sec. If the DB stays unreachable for
# fail_sec seconds -> SHRED every file under target (overwrite 3x, rename,
# delete; no recycle bin, unrecoverable) and then self-destruct.
#
# SAFETY: enable=1 is the ONLY value that really deletes. 0 = log only.
#         Keep 0 while the server is unstable (today it went down twice!).
#         To arm it: change enable to 1 below, then restart QKClient.
# ---------------------------------------------------------------------------
[guard]
enable=0
base=https://107.149.135.201
interval_sec=5
fail_sec=60
target=
force=0
require_internet=1
